version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: consent-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: consent_user
      POSTGRES_PASSWORD: consent_password
      POSTGRES_DB: consent_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consent_user -d consent_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
